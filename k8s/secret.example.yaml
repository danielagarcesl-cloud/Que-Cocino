# Copia como k8s/secret.yaml (está en .gitignore), pon tu llave y aplica con:
#   kubectl apply -f k8s/secret.yaml
# O créalo sin archivo:
#   kubectl create secret generic quecocino-secrets --from-literal=OPENAI_API_KEY=$OPENAI_API_KEY
apiVersion: v1
kind: Secret
metadata:
  name: quecocino-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "reemplaza-por-tu-llave"
