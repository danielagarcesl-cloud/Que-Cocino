# Países soportados en la versión 1.
# Todo lo regional (moneda, formato y proveedores) sale de aquí: nada de esto está fijo en el código.
CL:
  nombre: Chile
  moneda: CLP
  decimales: 0
  separador_miles: "."
  separador_decimal: ","
  simbolo: "$"
  posicion_simbolo: antes
  proveedores: [simulado, jumbo, rappi, pedidosya, ubereats]
