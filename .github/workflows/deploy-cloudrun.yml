name: Desplegar en Cloud Run

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Región de Cloud Run (la más cercana a tus usuarios)"
        default: southamerica-west1
        required: true

permissions:
  contents: read
  id-token: write

env:
  SERVICIO: quecocino

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICIO }}
          region: ${{ inputs.region }}
          source: .
          env_vars: |
            ENTORNO=cloudrun
          secrets: |
            OPENAI_API_KEY=openai-api-key:latest
          flags: --allow-unauthenticated --min-instances=0 --max-instances=3 --memory=512Mi --port=8080
